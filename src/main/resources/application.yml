server:
  port: 8090

spring:
  application:
    name: gateway-service
  
  # Database Configuration
  r2dbc:
    url: ${DATABASE_URL:r2dbc:postgresql://localhost:5432/admin_service}
    username: ${DATABASE_USERNAME:opensrp}
    password: ${DATABASE_PASSWORD:opensrp123}
  
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: ${ALLOWED_ORIGINS:http://localhost:3000,http://workflow.mdtlabs.org}
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
                allowCredentials: true
                maxAge: 3600
          routes:
            - id: admin-service
              uri: ${ADMIN_SERVICE_URI:http://localhost:8085}
              predicates:
                - Path=/admin/**
              filters:
                - name: JwtValidationFilter

management:
  endpoints:
    web:
      exposure:
        # Do not add "gateway" here. That endpoint can read and change the routes without a login.
        include: health,info

logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.mdl.smartcare.gateway.security: INFO

jwt:
  issuer: ${JWT_ISSUER:https://keycloak.mdtlabs.org/realms/smartcare}
  audience: ${JWT_AUDIENCE:account}
  roles-claim-path: ${JWT_ROLES_CLAIM_PATH:realm_access.roles}

keycloak:
  admin:
    server-url: ${KEYCLOAK_SERVER_URL:https://keycloak.mdtlabs.org}
    realm: ${KEYCLOAK_REALM:master}
    target-realm: ${KEYCLOAK_TARGET_REALM:smartcare}
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}
    # Preferred: a service account in the target realm.
    # Set realm = target realm, client-id = that client, and client-secret. Leave username and password empty.
    # The service account needs only the "manage-realm" role of the "realm-management" client.
    client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:}
    # Old way: a Keycloak admin user. Used only when client-secret is empty.
    username: ${KEYCLOAK_ADMIN_USERNAME:}
    password: ${KEYCLOAK_ADMIN_PASSWORD:}

# Permission sync (POST /api/permissions/sync-to-keycloak) creates and deletes Keycloak realm roles.
# It is off by default. When it is on, the caller must send a Bearer token that has required-role.
permission-sync:
  enabled: ${PERMISSION_SYNC_ENABLED:false}
  required-role: ${PERMISSION_SYNC_REQUIRED_ROLE:permission-sync}

authorization:
  enabled: ${AUTHORIZATION_ENABLED:true}

# Inbound HTTP Basic authentication support.
# When enabled, the gateway exchanges Basic credentials for a Keycloak token
# (OAuth2 resource-owner-password grant) before running the JWT pipeline.
# Use a DEDICATED confidential client (openhim-basic) with "Direct Access Grants"
# enabled and Standard Flow / Service Accounts disabled -- do NOT reuse the
# gateway-service client. token-uri MUST target the same realm as jwt.issuer,
# and client-secret MUST be injected as a real secret (never committed).
basic-auth:
  enabled: ${BASIC_AUTH_ENABLED:false}
  token-uri: ${BASIC_AUTH_TOKEN_URI:https://keycloak.mdtlabs.org/realms/smartcare/protocol/openid-connect/token}
  client-id: ${BASIC_AUTH_CLIENT_ID:openhim-basic}
  client-secret: ${BASIC_AUTH_CLIENT_SECRET:}
